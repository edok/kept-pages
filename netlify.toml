[build]
  publish = "public"
  # No build step: static files plus edge functions.
  command = "echo 'no build'"

# Landing-page photos are served by netlify/edge-functions/lp-asset.ts and
# resized/converted by Netlify Image CDN, which fetches them by full URL.
[images]
  remote_images = [
    'https://go\.keptcollection\.com/.*',
    'https://([a-z0-9-]+--)?kept-pages\.netlify\.app/.*',
  ]

# Landing-page videos (public/media/<page>/<name>-<hash>.mp4). The hash in the
# filename changes with the file, so they can be cached for a year.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Robots-Tag = "noindex"

# Pages kept in this repo as plain HTML (public/pages/<page>/), served through
# the router like a design export. Their images don't change names, so a day.
[[headers]]
  for = "/pages/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    X-Robots-Tag = "noindex"

# Kept favicon for every landing page (added to each page by the router).
[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
